[workspace]
members = ["crates/pad", "crates/voice"]

# Three crates rather than one with a feature flag. A feature kept CUDA out of the
# default build but left one manifest and one fingerprint: adding a dependency for
# the agent still invalidated the voice build, and flipping the feature relinked
# everything. Separate manifests cannot do that to each other.
[package]
name = "wow-companion"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
wow-companion-pad = { path = "crates/pad" }
wow-companion-voice = { path = "crates/voice" }
# the claude CLI's --output-format json envelope; not worth hand-parsing
serde_json = "1"
