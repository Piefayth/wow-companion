[workspace]
members = ["crates/pad", "crates/voice", "crates/settings"]
# the setup window is built on its own (its GUI library is a long compile, kept
# out of every workspace build and check): cargo build --manifest-path crates/setup/Cargo.toml
exclude = ["crates/setup"]

# Three crates rather than one with a feature flag. A feature kept CUDA out of the
# default build but left one manifest and one fingerprint: adding a dependency for
# the agent still invalidated the voice build, and flipping the feature relinked
# everything. Separate manifests cannot do that to each other.
[package]
name = "wow-companion"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
wow-companion-pad = { path = "crates/pad" }
wow-companion-settings = { path = "crates/settings" }
wow-companion-voice = { path = "crates/voice", default-features = false }
# the claude CLI's --output-format json envelope; not worth hand-parsing
serde_json = "1"

# the data strip is read with DXGI Desktop Duplication (src/strip.rs), the same
# crate version as crates/voice uses
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_Graphics_Direct3D", "Win32_Graphics_Direct3D11", "Win32_Graphics_Dxgi", "Win32_Graphics_Dxgi_Common", "Win32_Graphics_Gdi"] }

# Whisper's backend (crates/voice/Cargo.toml): `cargo build` is CUDA;
# `--no-default-features --features vulkan` for other GPUs; `--no-default-features`
# for CPU only.
[features]
default = ["cuda"]
cuda = ["wow-companion-voice/cuda"]
vulkan = ["wow-companion-voice/vulkan"]
